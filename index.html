<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL SHADAY GÁS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;text-align:center}
.top{padding:14px;font-weight:bold;font-size:14px}
h1{font-size:42px;margin-top:10px;letter-spacing:3px;font-weight:900}
h2{margin:20px}
.btn{color:white;padding:16px;margin:12px auto;border:none;border-radius:14px;font-size:16px;font-weight:bold;width:92%;max-width:400px;display:block;text-decoration:none;cursor:pointer;animation:piscaBotao 1s infinite}
.btn-zap{background:#25D366}
.btn-verde{background:#00A859}
.btn-insta{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.btn-musica{background:#FF6B00}
@keyframes piscaBotao{
0%{transform:scale(1); filter:brightness(1)}
50%{transform:scale(1.06); filter:brightness(1.3)}
100%{transform:scale(1); filter:brightness(1)}
}
</style>
</head>
<body>

<div id="statusTop" class="top"></div>

<h1>EL SHADAY</h1>
<p style="color:#00FF00;font-weight:bold;font-size:20px">GÁS - COPAGAZ</p>
<p style="margin-top:8px">Maceió/AL - Entregando em minutos</p>

<button id="btnMusica" onclick="tocarMusica()" class="btn btn-musica">🔊 Tocar Jingle EL SHADAY</button>

<audio id="player" loop preload="auto" autoplay playsinline>
  <source src="jingle.mp3" type="audio/ogg">
</audio>

<h2>Seu Gás Chega <span style="color:#FF6B00">em Minutos!</span></h2>

<a href="tel:+5582996647786" class="btn btn-verde">📦 DISK GÁS - 82 99664-7786</a>
<a href="https://wa.me/5582996647786?text=Ola%20EL%20SHADAY%20quero%20pedir%20um%20gas" class="btn btn-zap">💬 Pedir no WhatsApp</a>
<a href="https://wa.me/5582988217147?text=Quero%20ser%20revendedor" class="btn btn-verde">🚚 SEJA UM REVENDEDOR</a>
<a href="https://www.instagram.com/elshadaygasal" target="_blank" class="btn btn-insta">📸 Instagram @elshadaygasal</a>

<script>
let tocando=false;
let player=document.getElementById('player');
let btn=document.getElementById('btnMusica');

function tocarMusica(){
  if(!tocando){player.play().then(()=>{btn.innerHTML="🔇 Pausar Jingle";tocando=true});}
  else{player.pause();btn.innerHTML="🔊 Tocar Jingle EL SHADAY";tocando=false}
}

window.addEventListener('load', ()=>{
  player.volume=1;
  setTimeout(()=>{ player.play().then(()=>{tocando=true;btn.innerHTML="🔇 Pausar Jingle";}).catch(()=>{}); }, 500);
  setTimeout(()=>{ player.play().then(()=>{tocando=true;btn.innerHTML="🔇 Pausar Jingle";}).catch(()=>{}); }, 1500);
});

// Se o navegador bloquear, toca no primeiro toque
document.addEventListener('click', ()=>{ if(!tocando) tocarMusica(); }, {once:true});
document.addEventListener('touchstart', ()=>{ if(!tocando) tocarMusica(); }, {once:true});

function atualizaStatus(){
  let agora=new Date(); let dia=agora.getDay(); let hora=agora.getHours();
  let div=document.getElementById('statusTop'); let aberto=false;
  if(dia>=1&&dia<=5){if(hora>=7&&hora<18)aberto=true}
  else if(dia==6){if(hora>=7&&hora<14)aberto=true}
  if(aberto){
    div.innerHTML="🟢 ONLINE - Aberto agora! Seg-Sex 07h-18h | Sáb 07h-14h";
    div.style.background="#00A859";
  }else{
    div.innerHTML=dia==0?"🔴 OFFLINE - Domingo Fechado - Voltamos Segunda 07:00":"🔴 OFFLINE - Fechado - Voltamos às 07:00";
    div.style.background="#cc0000";
  }
}
atualizaStatus();
</script>
</body>
</html>
