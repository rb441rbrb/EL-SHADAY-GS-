.top{padding:12px;font-weight:bold;font-size:14px}

<body>

<div id="statusTop" class="top"></div>

<!-- SEU JINGLE -->
<button id="btnMusica" onclick="tocarMusica()" class="btn btn-musica">🔊 Tocar Jingle EL SHADAY</button>
<audio id="player" loop preload="auto">
  <source src="jingle.mp3" type="audio/mpeg">
</audio>

<h2 style="margin:20px">Seu Gás Chega <span style="color:#FF6B00">em Minutos!</span></h2>

<a href="https://www.instagram.com/elshadaygasal" target="_blank" class="btn btn-insta">📸 Instagram @elshadaygasal</a>

<script>
let tocando = false;
function tocarMusica(){
  let audio = document.getElementById('player');
  let btn = document.getElementById('btnMusica');
  if(!tocando){
    audio.play();
    btn.innerHTML = "🔇 Pausar Jingle";
    btn.style.background = "#333";
    tocando = true;
  } else {
    audio.pause();
    btn.innerHTML = "🔊 Tocar Jingle EL SHADAY";
    btn.style.background = "#FF6B00";
    tocando = false;
  }
}
function atualizaStatus(){
  let agora = new Date();
  let dia = agora.getDay();
  let hora = agora.getHours();
  let div = document.getElementById('statusTop');
  let aberto = false;
  if(dia >= 1 && dia <= 5){ if(hora >= 7 && hora < 18) aberto = true; }
  else if(dia == 6){ if(hora >= 7 && hora < 14) aberto = true; }
  if(aberto){
    div.innerHTML = "🟢 ONLINE - Aberto agora: Seg-Sex 07h-18h | Sáb 07h-14h";
    div.style.background = "#00A859";
  } else {
    div.innerHTML = dia==0 ? "🔴 OFFLINE - Domingo Fechado" : "🔴 OFFLINE - Voltamos às 07:00";
    div.style.background = "#cc0000";
  }
}
atualizaStatus();
</script>
