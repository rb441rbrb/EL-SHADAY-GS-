<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL SHADAY GÁS - Entrega em Minutos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0a0a0a; color: white; text-align: center; }
    
    .top-bar { background: #00a000; padding: 10px; display: flex; justify-content: center; gap: 10px; align-items: center; font-weight: bold; }
    .ao-vivo { background: #003300; padding: 5px 12px; border-radius: 20px; color: #00ff00; }
    
    header { padding: 30px 20px; }
    .logo { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .logo-icon { background: #ff5500; width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .logo-text h1 { font-size: 28px; }
    .logo-text p { color: #00a000; font-weight: bold; }
    
    .status { color: #00ff00; margin: 10px 0; }
    
    .titulo { font-size: 26px; padding: 0 20px; margin: 20px 0; }
    .titulo span { color: #ff5500; }
    
    .descricao { color: #aaa; padding: 0 20px; margin-bottom: 30px; }
    
    .btn { display: block; background: #00a000; color: white; padding: 18px; margin: 12px 20px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 16px; }
    .btn.whatsapp { background: #25D366; }
    .btn.outline { background: transparent; border: 2px solid #555; }
    
    .cards { display: flex; gap: 10px; padding: 20px; }
    .card { background: #1a1a1a; padding: 15px; border-radius: 12px; flex: 1; }
    .card.green { background: #00a000; }
    
    .porque { background: #111; margin: 20px; padding: 20px; border-radius: 12px; border: 1px solid #00a000; text-align: left; }
    .item { display: flex; gap: 10px; margin: 15px 0; align-items: flex-start; }
    .check { background: #00a000; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    
    .selo { background: #1a1a1a; margin: 20px; padding: 15px; border-radius: 12px; display: flex; gap: 10px; align-items: center; }
  </style>
</head>
<body>

  <div class="top-bar">
    <span class="ao-vivo">🕐 AO VIVO</span>
    <span>Aberto agora: Seg a Sáb 07:00 às 18:00 | Dom 07:00 às 14:00</span>
  </div>
